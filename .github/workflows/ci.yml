name: CI

# The public pipeline: nonagenticai/ci-workflows/python-service.yml on GitHub-hosted runners,
# with no repository secrets, publishing ghcr.io/nonagenticai/coding-repo-jobs from main.
#
# There is no deploy job. Flux watches the ImagePolicy for this service and rolls it when the
# image changes — the repo never holds cluster credentials.
#
# While this repository was private it ran the private deployment archetype; that job is gone
# rather than gated because GitHub parses a called workflow even when the calling job's `if:`
# is false, so a public repository that keeps a private `uses:` cannot dispatch CI at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: nonagenticai/ci-workflows/.github/workflows/python-service.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: coding-repo-jobs
      database_name: coding_repo_jobs_ci
      src_dir: src
      has_postgres: true
      alembic: true
      # /health returns 200 without a live DB; ENVIRONMENT=testing relaxes the
      # required-in-production validator and keeps the worker loop dormant.
      build_smoke: |
        docker run -d --name smoke-coding-repo-jobs \
          -e ENVIRONMENT=testing \
          -e DATABASE_URL=postgresql+psycopg://smoke:smoke@127.0.0.1:5432/smoke \
          -p 18695:8695 "$IMAGE_REF"
        ok=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:18695/health >/dev/null 2>&1; then
            echo "health ok (attempt $i)"; ok=1; break
          fi
          sleep 1
        done
        docker logs smoke-coding-repo-jobs || true
        docker rm -f smoke-coding-repo-jobs || true
        [ "$ok" -eq 1 ]
